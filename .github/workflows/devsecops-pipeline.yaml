name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  security-scan:
    name: DevSecOps Pipeline
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout Source Code
      # ----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Secret Scan
      # ----------------------------------------
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2

      # ----------------------------------------
      # SAST Scan
      # ----------------------------------------
      - name: Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: |
            p/security-audit
            p/python

      # ----------------------------------------
      # Trivy Filesystem Scan
      # ----------------------------------------
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: 0

      # ----------------------------------------
      # Upload Filesystem SARIF
      # ----------------------------------------
      - name: Upload Trivy Filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

      # ----------------------------------------
      # Login to GHCR
      # ----------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------
      # Build Docker Image
      # ----------------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/ledger-api-app:latest .

      # ----------------------------------------
      # Push Docker Image
      # ----------------------------------------
      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/ledger-api-app:latest

      # ----------------------------------------
      # Trivy Image Scan
      # ----------------------------------------
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ledger-api-app:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-image-results.sarif
          exit-code: 0

      # ----------------------------------------
      # Upload Image SARIF
      # ----------------------------------------
      - name: Upload Trivy Image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image
